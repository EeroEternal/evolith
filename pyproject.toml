[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evolith"
version = "0.1.0"
description = "Recursive Self-Improvement (RSI) Engine for LLM Inference Kernels, Runtime Schedulers & Cluster Routing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "PengX", email = "lipiisme@users.noreply.github.com" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
evolith = "evolith.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evolith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
